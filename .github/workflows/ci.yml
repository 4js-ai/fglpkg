name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test and cross-platform build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go v6+ sets GOTOOLCHAIN=local, so the go command can no longer
      # silently download a newer toolchain than the one installed here. With
      # go-version-file that is the version go.mod names (1.20), which is what
      # we want pinned — the newer toolchains compile stdlib API that 1.20
      # rejects.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (with race detector)
        run: go test -race ./...

      - name: Cross-platform build via cmd/build.sh
        env:
          FGLPKG_VERSION: ci-${{ github.ref_name }}
          FGLPKG_BUILD: ${{ github.sha }}
        run: ./cmd/build.sh

      - name: Upload cross-platform binaries
        uses: actions/upload-artifact@v7
        with:
          name: fglpkg-binaries-${{ github.sha }}
          path: bin/
          retention-days: 7
