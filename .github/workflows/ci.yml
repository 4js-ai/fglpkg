name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test and cross-platform build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go-version-file installs the version go.mod's `go` line names; that is
      # the toolchain pin. (setup-go v6+ also exports GOTOOLCHAIN=local, which
      # go < 1.21 ignores.)
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (with race detector)
        run: go test -race ./...

      - name: Cross-platform build via cmd/build.sh
        env:
          FGLPKG_VERSION: ci-${{ github.ref_name }}
          FGLPKG_BUILD: ${{ github.sha }}
        run: ./cmd/build.sh

      - name: Upload cross-platform binaries
        uses: actions/upload-artifact@v7
        with:
          name: fglpkg-binaries-${{ github.sha }}
          path: bin/
          retention-days: 7
